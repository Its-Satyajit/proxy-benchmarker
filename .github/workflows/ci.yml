name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".gitignore"
      - "*.txt"
      - "*.html"
      - "*.json"
      - "images/**"
  pull_request:
    branches:
      - main
      - master
  # Manual runs, and the dispatch the release workflow uses to verify the
  # dist/pin commit it pushes (GITHUB_TOKEN pushes do not trigger workflows).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Nub
        run: |
          curl -fsSL https://nubjs.com/install.sh | bash
          echo "$HOME/.nub/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: nub install

      - name: Typecheck TypeScript
        run: nub run typecheck

      - name: Run Test Suite
        run: nub run test

      - name: Build Standalone Bundle
        run: nub run build

      # The runners download the committed bundle, so source and dist must not drift.
      - name: Verify Committed Bundle Is Fresh
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/proxy-benchmarker.min.mjs is stale. Run 'nub run build' and commit the result."
            exit 1
          fi

      # run.sh pins an immutable release ref; catch a forgotten bump here, not in user terminals.
      - name: Verify Pinned Runner Ref
        run: |
          PINNED_REF="$(sed -n 's/.*PROXY_BENCHMARKER_REF:-\([^}"]*\).*/\1/p' run.sh | head -1)"
          URL="https://cdn.jsdelivr.net/gh/Its-Satyajit/proxy-benchmarker@${PINNED_REF}/dist/proxy-benchmarker.min.mjs"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL")"
          if [ "$CODE" != "200" ]; then
            echo "::error::pinned runner ref ${PINNED_REF} does not resolve (HTTP ${CODE}). Bump run.sh and run.ps1 after a release."
            exit 1
          fi
          echo "pinned runner ref ${PINNED_REF} resolves"
