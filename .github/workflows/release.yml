name: Release Minified Bundle

on:
  push:
    branches:
      - main
      - master
    # The sync step below commits run.sh, run.ps1 and dist, so those paths must
    # not re-trigger this workflow or the release would loop on itself.
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".gitignore"
      - "*.txt"
      - "*.html"
      - "*.json"
      - "run.sh"
      - "run.ps1"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-bundle
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Nub
        run: |
          curl -fsSL https://nubjs.com/install.sh | bash
          echo "$HOME/.nub/bin" >> $GITHUB_PATH

      - name: Install Dependencies with Nub
        run: nub install

      - name: Typecheck TypeScript
        run: nub run typecheck

      - name: Run Test Suite
        run: nub run test

      - name: Build and Minify Bundle with Nub
        run: nub run build

      - name: Generate Version Tag
        id: tag
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # The tag points at the commit whose source produced this bundle. The sync
      # step below then commits the same bundle plus the new pin on top of it.
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Release ${{ steps.tag.outputs.version }}"
          body: |
            ## Proxy Benchmarker ${{ steps.tag.outputs.version }}

            ### Quick Run
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Its-Satyajit/proxy-benchmarker/master/run.sh | bash
            ```
          generate_release_notes: true
          files: |
            dist/proxy-benchmarker.min.mjs
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync dist artifact and runner pin to master
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Publish the exact bundle that was just released back into /dist.
          git add dist/proxy-benchmarker.min.mjs

          # 2. Move the immutable runner pin forward in both entry scripts.
          sed -i -E "s/v1\.0\.[0-9]+/${VERSION}/g" run.sh run.ps1

          # Fail loudly instead of shipping a stale pin.
          grep -q "PROXY_BENCHMARKER_REF:-${VERSION}" run.sh || {
            echo "::error::run.sh pin was not set to ${VERSION}"; exit 1;
          }
          grep -q "\"${VERSION}\"" run.ps1 || {
            echo "::error::run.ps1 pin was not set to ${VERSION}"; exit 1;
          }

          git add run.sh run.ps1

          if git diff --quiet --cached; then
            echo "Nothing to sync: dist and runner pins already at ${VERSION}."
            exit 0
          fi

          git commit -m "chore(release): pin runner to ${VERSION} and refresh dist"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "pushed=1" >> "$GITHUB_ENV"

      # A push made with the default GITHUB_TOKEN does not start other workflows,
      # so the commit above would otherwise never be verified. workflow_dispatch
      # is the documented exception.
      - name: Verify the sync commit in CI
        if: env.pushed == '1'
        run: gh workflow run ci.yml --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
