name: Release Minified Bundle

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "*.txt"
      - "*.html"
      - "*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Nub
        run: |
          curl -fsSL https://nubjs.com/install.sh | bash
          echo "$HOME/.nub/bin" >> $GITHUB_PATH

      - name: Install Dependencies with Nub
        run: nub install

      - name: Typecheck TypeScript
        run: nub run typecheck

      - name: Build and Minify Bundle with Nub
        run: nub run build

      - name: Generate Version Tag
        id: tag
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Release ${{ steps.tag.outputs.version }}"
          body: |
            ## Proxy Benchmarker ${{ steps.tag.outputs.version }}

            ### Quick Run
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Its-Satyajit/proxy-benchmarker/master/run.sh | bash
            ```
          generate_release_notes: true
          files: |
            dist/proxy-benchmarker.min.mjs
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
